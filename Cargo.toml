[package]
name = "oreo"
version = "0.1.0"
description = "Emac's dired for grep/fd"
authors = ["Simar Malhotra <malhotrasimar009@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
# use-dev-tty: read keyboard events from /dev/tty so piped stdin still works
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
cream = { path = "cream" }
ratatui = "0.30.2"
anyhow = "1.0.104"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
